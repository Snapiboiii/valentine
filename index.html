<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #ffd1dc, #ffb6c1);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  text-align: center;
  width: 100%;
  max-width: 500px;
}

h1 {
  color: #ff2e63;
  font-size: 32px;
  margin-bottom: 10px;
}

img {
  width: 220px;
  max-width: 90%;
  transition: transform 0.4s ease;
  margin: 15px 0;
}

p {
  font-size: 20px;
  color: #333;
  line-height: 1.6;
  margin-bottom: 30px;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

button {
  padding: 18px;
  border-radius: 40px;
  border: none;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

#yesBtn {
  background: #ff2e63;
  color: white;
  transform: scale(1);
}

#noBtn {
  background: white;
  color: #444;
  transform: scale(1);
}

/* Mobile optimization */
@media (max-width: 480px) {
  h1 {
    font-size: 34px;
  }

  p {
    font-size: 22px;
  }

  button {
    font-size: 22px;
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>💌 Hey You 💌</h1>

  <img id="gif" src="rose.gif" alt="Bear GIF">

  <p id="text">
    I could write long messages,<br>
    or hide behind jokes and code…<br><br>
    Will you be my Valentine?
  </p>

  <div class="buttons">
    <button id="yesBtn">YES?? :></button>
    <button id="noBtn">I’ll think about it 🥺</button>
  </div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const gif = document.getElementById("gif");
const text = document.getElementById("text");

let noClicks = 0;
let yesScale = 1;
let noScale = 1;

const messages = [
  "Owhh why:<<",
  "That’s 2… Im sad now:<< ",
  "3 times?? NOOOOOOOOOOOOOO",
  "4 clicks… I think you dont love me bubu:<<",
  "5 already?!",
  "6 times… okay okay 😳",
  "Last chance BUBU:<<<"
];

noBtn.addEventListener("click", () => {
  noClicks++;

  // Make YES grow
  yesScale += 0.15;
  yesBtn.style.transform = `scale(${yesScale})`;

  // Make NO shrink
  noScale -= 0.12;
  if (noScale < 0.2) noScale = 0.2;
  noBtn.style.transform = `scale(${noScale})`;

  // Change message
  text.innerHTML = messages[Math.min(noClicks - 1, messages.length - 1)];

  // After 7 clicks remove NO button
  if (noClicks >= 7) {
    noBtn.style.display = "none";
  }
});

yesBtn.addEventListener("click", () => {
  yesBtn.disabled = true;
  noBtn.style.display = "none";

  gif.src = "dance.gif";
  gif.style.transform = "scale(1.6)";

  text.innerHTML = "YAYYY!!! 💃🕺<br>You’re officially my Valentine ❤️";
});
</script>

</body>
</html>
