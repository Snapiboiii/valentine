<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
  * {
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
  }

  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffd1dc, #ffb6c1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    text-align: center;
    max-width: 420px;
    padding: 20px;
  }

  h1 {
    color: #ff4d6d;
    margin-bottom: 10px;
  }

  img {
    width: 180px;
    transition: transform 0.5s ease;
    margin: 15px 0;
  }

  p {
    color: #444;
    line-height: 1.5;
    margin-bottom: 25px;
    min-height: 60px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  button {
    border-radius: 30px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    overflow: hidden;
  }

  #yesBtn {
    background: #ff4d6d;
    color: white;
    height: 50px;
  }

  #noBtn {
    background: #f0f0f0;
    height: 50px;
  }
</style>
</head>

<body>

<div class="container">
  <h1>💌 Hey You 💌</h1>

  <img id="gif" src="rose.gif" alt="Bear GIF">

  <p id="text">
    I could write long messages,<br>
    or hide behind jokes and code…<br><br>
    Will you be my Valentine?
  </p>

  <div class="buttons">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">I’ll think about it 🥺</button>
  </div>
</div>

<script>
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const gif = document.getElementById("gif");
  const text = document.getElementById("text");

  let yesHeight = 50;
  let noHeight = 50;
  let hesitationClicks = 0;

  const messages = [
    "Hmm… thinking already? 😏",
    "Take your time… I’ll wait 💕",
    "Still thinking? I’m getting hopeful 😌",
    "Okay… now you’re just teasing 💖"
  ];

  noBtn.addEventListener("click", () => {
    hesitationClicks++;

    yesHeight += 14;
    noHeight -= 14;

    if (noHeight <= 0) {
      noHeight = 0;
      noBtn.style.opacity = "0";
      noBtn.style.pointerEvents = "none";
    }

    yesBtn.style.height = yesHeight + "px";
    noBtn.style.height = noHeight + "px";

    text.innerHTML = messages[Math.min(hesitationClicks - 1, messages.length - 1)];
  });

  yesBtn.addEventListener("click", () => {
    yesBtn.disabled = true;
    noBtn.disabled = true;

    gif.src = "dance.gif";
    gif.style.transform = "scale(1.7)";

    text.innerHTML = "YAY!! 💃🕺<br>You’re officially my Valentine ❤️";

    noBtn.style.opacity = "0";
  });
</script>

</body>
</html>
